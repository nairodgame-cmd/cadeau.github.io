<!DOCTYPE html>
<html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Idées Cadeaux</title>
  <meta name="theme-color" content="#F4F3EF">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Police Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          boxShadow: {
            'studio': '0 4px 18px -4px rgba(0, 0, 0, 0.06), 0 1px 4px -1px rgba(0, 0, 0, 0.04)',
            'float': '0 20px 45px -10px rgba(0, 0, 0, 0.32), 0 0 1px 1px rgba(255, 255, 255, 0.12)',
          }
        }
      }
    }
  </script>

  <style id="core-styles">
    body {
      background-color: #F4F3EF;
      -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111214;
      }
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Carte Studio sobre et équilibrée */
    .gift-card {
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.22s ease;
    }
    .gift-card:active {
      transform: scale(0.98);
    }
    @media (hover: hover) {
      .gift-card:hover {
        transform: translateY(-3px);
      }
    }

    /* Fenêtres modales fluides */
    .modal-backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-panel {
      transform: translateY(20px) scale(0.97);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
    }
    .modal-panel.active {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>

<body class="text-zinc-900 dark:text-zinc-100 font-sans antialiased min-h-screen selection:bg-zinc-900 selection:text-white dark:selection:bg-white dark:selection:text-zinc-900">

  <!-- ===================================================================== -->
  <!-- BARRE DES 4 CATÉGORIES PERSONNES EN HAUT (DORIAN / MARIE / AMBRE / ALIÉNOR) -->
  <!-- ===================================================================== -->
  <header class="sticky top-0 z-30 pt-3 pb-2 px-3 bg-[#F4F3EF]/85 dark:bg-[#111214]/85 backdrop-blur-md">
    <div class="max-w-[920px] mx-auto flex flex-col items-center">
      <nav id="person-tabs" aria-label="Catégories par personne" class="inline-flex items-center gap-1 p-1 rounded-2xl bg-zinc-200/75 dark:bg-zinc-800/80 border border-zinc-300/50 dark:border-zinc-700/50 max-w-full overflow-x-auto no-scrollbar"></nav>
    </div>
  </header>

  <!-- ===================================================================== -->
  <!-- GRILLE COMPACTE ET SOBRE DE CARTES STUDIO (MAX-WIDTH 920PX)           -->
  <!-- ===================================================================== -->
  <main class="max-w-[920px] mx-auto px-3 sm:px-5 pt-2 sm:pt-4 pb-40">
    <div id="gifts-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 sm:gap-4"></div>
  </main>

  <!-- ===================================================================== -->
  <!-- BOUTON CADENAS DISCRET (EN BAS À DROITE)                              -->
  <!-- ===================================================================== -->
  <button id="lock-btn" type="button" onclick="handleLockClick()" aria-label="Mode Propriétaire" class="fixed bottom-4 right-4 z-40 w-10 h-10 rounded-full bg-zinc-200/80 dark:bg-zinc-800/80 backdrop-blur-md text-zinc-600 dark:text-zinc-300 flex items-center justify-center text-sm shadow-md opacity-40 hover:opacity-100 active:scale-90 transition-all">🔒</button>

  <!-- ===================================================================== -->
  <!-- BARRE FLOTTANTE PROPRIÉTAIRE (VISIBLE UNIQUEMENT SI DÉVERROUILLÉ)     -->
  <!-- ===================================================================== -->
  <div id="owner-bar" class="fixed bottom-3 inset-x-0 z-40 px-3 pointer-events-none hidden">
    <div class="max-w-[720px] mx-auto p-2.5 rounded-[22px] bg-zinc-900/95 dark:bg-zinc-800/95 text-white backdrop-blur-xl shadow-float border border-white/10 pointer-events-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex flex-wrap items-center gap-1.5">
        <button type="button" onclick="openGiftModal()" class="px-3 py-1.5 rounded-xl bg-white text-zinc-900 text-xs font-extrabold active:scale-95 transition">
          + Ajouter
        </button>
        <button type="button" onclick="openGitHubModal()" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold flex items-center gap-1.5 transition">
          <span id="gh-status-dot" class="w-2 h-2 rounded-full bg-amber-300 animate-pulse"></span>
          <span>⚡ Push Direct GitHub</span>
        </button>
        <button type="button" onclick="document.getElementById('import-html-input').click()" class="px-2.5 py-1.5 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 text-xs font-bold transition">
          📂 Importer HTML
        </button>
        <input id="import-html-input" type="file" accept=".html,.htm" class="hidden" onchange="importHTMLFile(event)">
        <button type="button" onclick="downloadUpdatedHTML()" class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold transition">
          💾 HTML
        </button>
      </div>
      <div class="flex items-center gap-1.5">
        <button type="button" onclick="lockOwnerMode()" class="px-2.5 py-1.5 rounded-xl bg-rose-500/20 text-rose-200 hover:bg-rose-600 hover:text-white text-xs font-bold transition">
          Verrouiller
        </button>
      </div>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- MODALE CODE PIN                                                       -->
  <!-- ===================================================================== -->
  <div id="pin-modal-backdrop" class="modal-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
    <div id="pin-modal-panel" class="modal-panel w-full max-w-xs rounded-[26px] bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-extrabold">Mode Propriétaire</h3>
        <button type="button" onclick="closePinModal()" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-xs font-bold">✕</button>
      </div>
      <input id="pin-input" type="password" inputmode="numeric" placeholder="Code incorrect" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-center text-lg font-extrabold tracking-widest focus:outline-none mb-3" onkeydown="if(event.key==='Enter') verifyPin()">
      <button type="button" onclick="verifyPin()" class="w-full py-2.5 rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-xs font-extrabold">
        Déverrouiller
      </button>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- MODALE AJOUT / MODIFICATION DE CADEAU                                 -->
  <!-- ===================================================================== -->
  <div id="gift-modal-backdrop" class="modal-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="gift-modal-panel" class="modal-panel w-full max-w-md rounded-t-[26px] sm:rounded-[26px] bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 p-5 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3.5">
        <h3 id="gift-modal-title" class="text-base font-extrabold">Modifier le cadeau</h3>
        <button type="button" onclick="closeGiftModal()" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-xs font-bold">✕</button>
      </div>

      <div class="space-y-3">
        <!-- Choix de la personne -->
        <div>
          <label class="block text-[11px] font-bold text-zinc-500 dark:text-zinc-400 mb-1">Catégorie (Personne)</label>
          <div id="modal-person-selector" class="grid grid-cols-4 gap-1.5"><button type="button" onclick="selectModalPerson('Dorian')" class="py-1.5 rounded-xl text-xs font-extrabold border transition bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 border-transparent">Dorian</button><button type="button" onclick="selectModalPerson('Marie')" class="py-1.5 rounded-xl text-xs font-extrabold border transition bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 border-transparent">Marie</button><button type="button" onclick="selectModalPerson('Ambre')" class="py-1.5 rounded-xl text-xs font-extrabold border transition bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 border-zinc-900 dark:border-white">Ambre</button><button type="button" onclick="selectModalPerson('Aliénor')" class="py-1.5 rounded-xl text-xs font-extrabold border transition bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 border-transparent">Aliénor</button></div>
        </div>

        <!-- Lien produit -->
        <div>
          <label class="block text-[11px] font-bold text-zinc-500 dark:text-zinc-400 mb-1">Lien du produit</label>
          <input id="gift-url-input" type="url" placeholder="https://..." oninput="handleUrlAutoFetch(this.value)" class="w-full px-3 py-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-xs font-medium focus:outline-none">
          <p id="url-fetch-hint" class="text-[11px] text-zinc-500 mt-1 hidden"></p>
        </div>

        <!-- Nom + Prix -->
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block text-[11px] font-bold text-zinc-500 dark:text-zinc-400 mb-1">Nom de l'article</label>
            <input id="gift-title-input" type="text" placeholder="Ex: Lego F1 Audi" class="w-full px-3 py-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-xs font-semibold focus:outline-none">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-zinc-500 dark:text-zinc-400 mb-1">Prix conseillé</label>
            <input id="gift-price-input" type="text" placeholder="Ex: 20 €" class="w-full px-3 py-2 rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-xs font-semibold focus:outline-none">
          </div>
        </div>

        <!-- Image (URL ou Fichier local compressé) -->
        <div>
          <label class="block text-[11px] font-bold text-zinc-500 dark:text-zinc-400 mb-1">Image (URL automatique ou photo)</label>
          <div class="flex items-center gap-2">
            <div class="w-12 h-12 rounded-xl bg-white border border-zinc-200 dark:border-zinc-700 p-1 flex items-center justify-center shrink-0 overflow-hidden">

  <script>
    const PEOPLE = ['Dorian', 'Marie', 'Ambre', 'Aliénor'];
    const STORAGE_KEY_GIFTS = 'minimal_cards_gifts_v4';
    const STORAGE_KEY_PIN = 'minimal_cards_pin_v4';
    const STORAGE_KEY_GH = 'minimal_cards_gh_config_v4';

    let appState = {
      pin: '0000',
      gifts: []
    };

    let currentPerson = 'Dorian';
    let isOwner = false;
    let editingGiftId = null;
    let modalSelectedPerson = 'Dorian';
    let urlFetchTimeout = null;

    function initApp() {
      // 1. Chargement depuis le bloc JSON embarqué dans le HTML
      try {
        const embeddedEl = document.getElementById('embedded-app-state');
        if (embeddedEl && embeddedEl.textContent.trim()) {
          const parsed = JSON.parse(embeddedEl.textContent.trim());
          if (parsed && Array.isArray(parsed.gifts)) {
            appState.gifts = parsed.gifts;
          }
          if (parsed && parsed.pin) {
            appState.pin = String(parsed.pin);
          }
        }
      } catch (e) {}

      // 2. Récupération depuis localStorage si une sauvegarde locale plus complète s'y trouve
      try {
        const localGifts = localStorage.getItem(STORAGE_KEY_GIFTS);
        if (localGifts) {
          const parsedGifts = JSON.parse(localGifts);
          if (Array.isArray(parsedGifts) && parsedGifts.length >= appState.gifts.length) {
            appState.gifts = parsedGifts;
          }
        }
        const localPin = localStorage.getItem(STORAGE_KEY_PIN);
        if (localPin) {
          appState.pin = String(localPin);
        }
      } catch (e) {}

      saveStateLocally();
      updateGitHubIndicator();
      renderAll();
    }

    function saveStateLocally() {
      try {
        localStorage.setItem(STORAGE_KEY_GIFTS, JSON.stringify(appState.gifts));
        localStorage.setItem(STORAGE_KEY_PIN, String(appState.pin));
      } catch (e) {}

      const embeddedEl = document.getElementById('embedded-app-state');
      if (embeddedEl) {
        embeddedEl.textContent = '\n' + JSON.stringify(appState, null, 2) + '\n  ';
      }
    }

    function renderAll() {
      renderPersonTabs();
      renderGiftsGrid();
    }

    function renderPersonTabs() {
      const nav = document.getElementById('person-tabs');
      if (!nav) return;

      nav.innerHTML = PEOPLE.map(person => {
        const count = appState.gifts.filter(g => (g.person || 'Dorian') === person).length;
        const active = person === currentPerson;
        const btnClasses = active
          ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 shadow-xs'
          : 'text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white';
        const badgeClasses = active
          ? 'bg-white/20 text-white dark:bg-zinc-900/15 dark:text-zinc-900'
          : 'bg-zinc-300/70 dark:bg-zinc-700/80 text-zinc-600 dark:text-zinc-300';

        return `
          <button type="button" onclick="selectPersonTab('${person}')" class="px-3.5 sm:px-4 py-1.5 rounded-xl text-xs sm:text-[13px] font-extrabold transition-all duration-150 flex items-center gap-1.5 whitespace-nowrap active:scale-95 ${btnClasses}">
            <span>${person}</span>
            <span class="px-1.5 py-0.2 rounded-md text-[10px] font-bold ${badgeClasses}">${count}</span>
          </button>
        `;
      }).join('');
    }

    function selectPersonTab(person) {
      currentPerson = person;
      renderAll();
    }

    function renderGiftsGrid() {
      const grid = document.getElementById('gifts-grid');
      if (!grid) return;

      const filtered = appState.gifts.filter(g => (g.person || 'Dorian') === currentPerson);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-2 sm:col-span-3 md:col-span-4 py-16 text-center text-xs font-semibold text-zinc-400 dark:text-zinc-500">
            Aucune idée cadeau pour ${escapeHtml(currentPerson)}.
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(gift => {
        const safeTitle = escapeHtml(gift.title || 'Cadeau');
        const safePrice = escapeHtml(gift.price || '');
        const safeUrl = escapeHtml(gift.url || '#');
        const fallbackText = encodeURIComponent((gift.title || 'Cadeau').slice(0, 14));
        const fallbackImg = `https://placehold.co/500x500/FFFFFF/3F3F46?text=${fallbackText}`;
        const safeImg = escapeHtml(gift.image || fallbackImg);

        const ownerButtons = isOwner ? `
          <div class="absolute top-2.5 right-2.5 z-20 flex items-center gap-1" onclick="event.preventDefault(); event.stopPropagation();">
            <button type="button" onclick="openGiftModal('${gift.id}')" class="w-7 h-7 rounded-lg bg-zinc-900/85 text-white flex items-center justify-center text-xs shadow-md active:scale-90 transition" title="Modifier">✎</button>
            <button type="button" onclick="deleteGift('${gift.id}')" class="w-7 h-7 rounded-lg bg-rose-600/90 text-white flex items-center justify-center text-xs shadow-md active:scale-90 transition" title="Supprimer">✕</button>
          </div>
        ` : '';

        const priceBadge = safePrice ? `
          <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-zinc-100 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-200 text-[11px] sm:text-xs font-extrabold tracking-tight">
            ${safePrice}
          </span>
        ` : `<span></span>`;

        return `
          <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" class="gift-card group rounded-[20px] overflow-hidden bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800/90 shadow-studio flex flex-col select-none">
            <div class="relative aspect-square w-full overflow-hidden bg-white border-b border-zinc-100 dark:border-zinc-800/60">
              <div class="w-full h-full flex items-center justify-center p-3 sm:p-4">
                <img src="${safeImg}" alt="${safeTitle}" onerror="this.onerror=null; this.src='${fallbackImg}';" style="max-width: 100%; max-height: 100%;" class="w-auto h-auto object-contain object-center rounded-[10px] transition-transform duration-300 ease-out group-hover:scale-[1.04]" loading="lazy">
              </div>
              ${ownerButtons}
            </div>
            <div class="p-3 sm:p-3.5 flex flex-col justify-between flex-1 bg-white dark:bg-zinc-900">
              <h2 class="text-zinc-900 dark:text-zinc-100 font-bold text-xs sm:text-[13px] leading-snug line-clamp-2 mb-2">
                ${safeTitle}
              </h2>
              <div class="flex items-center justify-between gap-2 pt-0.5 mt-auto">
                ${priceBadge}
                <span class="w-6 h-6 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 flex items-center justify-center text-[11px] font-bold shrink-0 group-hover:bg-zinc-900 group-hover:text-white dark:group-hover:bg-white dark:group-hover:text-zinc-900 transition-colors">
                  ↗
                </span>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    // =========================================================================
    // MODE PROPRIÉTAIRE & CODE PIN
    // =========================================================================
    function handleLockClick() {
      if (isOwner) {
        lockOwnerMode();
      } else {
        document.getElementById('pin-input').value = '';
        openModal('pin-modal-backdrop', 'pin-modal-panel');
        setTimeout(() => document.getElementById('pin-input').focus(), 80);
      }
    }

    function verifyPin() {
      const entered = document.getElementById('pin-input').value.trim();
      if (entered === String(appState.pin)) {
        isOwner = true;
        document.getElementById('owner-bar').classList.remove('hidden');
        document.getElementById('lock-btn').textContent = '🔓';
        closePinModal();
        renderAll();
      } else {
        const input = document.getElementById('pin-input');
        input.value = '';
        input.placeholder = 'Code incorrect';
      }
    }

    function lockOwnerMode() {
      isOwner = false;
      document.getElementById('owner-bar').classList.add('hidden');
      document.getElementById('lock-btn').textContent = '🔒';
      renderAll();
    }

    function closePinModal() {
      closeModal('pin-modal-backdrop', 'pin-modal-panel');
    }

    function saveNewPin() {
      const newPin = document.getElementById('new-pin-input').value.trim();
      if (!newPin) return;
      appState.pin = newPin;
      document.getElementById('new-pin-input').value = '';
      saveStateLocally();

      const btn = document.getElementById('pin-save-btn');
      const oldText = btn.textContent;
      btn.textContent = '✓ Enregistré';
      setTimeout(() => { btn.textContent = oldText; }, 1200);

      pushToGitHubIfConfigured();
    }

    // =========================================================================
    // AJOUT / ÉDITION / SUPPRESSION DE CADEAU
    // =========================================================================
    function renderModalPersonSelector() {
      const container = document.getElementById('modal-person-selector');
      container.innerHTML = PEOPLE.map(p => {
        const active = p === modalSelectedPerson;
        const cls = active
          ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 border-zinc-900 dark:border-white'
          : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 border-transparent';
        return `<button type="button" onclick="selectModalPerson('${p}')" class="py-1.5 rounded-xl text-xs font-extrabold border transition ${cls}">${p}</button>`;
      }).join('');
    }

    function selectModalPerson(person) {
      modalSelectedPerson = person;
      renderModalPersonSelector();
    }

    function openGiftModal(giftId = null) {
      editingGiftId = giftId;
      const hint = document.getElementById('url-fetch-hint');
      hint.classList.add('hidden');
      hint.textContent = '';

      if (giftId) {
        const g = appState.gifts.find(x => String(x.id) === String(giftId));
        if (!g) return;
        document.getElementById('gift-modal-title').textContent = 'Modifier le cadeau';
        modalSelectedPerson = g.person || 'Dorian';
        document.getElementById('gift-url-input').value = g.url || '';
        document.getElementById('gift-title-input').value = g.title || '';
        document.getElementById('gift-price-input').value = g.price || '';
        document.getElementById('gift-image-input').value = g.image || '';
        updateModalImagePreview(g.image || '');
      } else {
        document.getElementById('gift-modal-title').textContent = 'Ajouter un cadeau';
        modalSelectedPerson = currentPerson;
        document.getElementById('gift-url-input').value = '';
        document.getElementById('gift-title-input').value = '';
        document.getElementById('gift-price-input').value = '';
        document.getElementById('gift-image-input').value = '';
        updateModalImagePreview('');
      }

      renderModalPersonSelector();
      openModal('gift-modal-backdrop', 'gift-modal-panel');
    }

    function closeGiftModal() {
      closeModal('gift-modal-backdrop', 'gift-modal-panel');
    }

    function updateModalImagePreview(src) {
      const preview = document.getElementById('gift-img-preview');
      preview.src = src && src.trim()
        ? src.trim()
        : 'https://placehold.co/200x200/FFFFFF/3F3F46?text=Photo';
    }

    function handleUrlAutoFetch(url) {
      clearTimeout(urlFetchTimeout);
      const hint = document.getElementById('url-fetch-hint');
      if (!url || !url.startsWith('http')) {
        hint.classList.add('hidden');
        return;
      }

      hint.textContent = 'Recherche automatique de l\'image...';
      hint.classList.remove('hidden');

      urlFetchTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
          const data = await res.json();
          if (data && data.status === 'success' && data.data) {
            const imgUrl = data.data.image?.url || data.data.logo?.url;
            const title = data.data.title;
            const imgInput = document.getElementById('gift-image-input');
            const titleInput = document.getElementById('gift-title-input');

            if (imgUrl && !imgInput.value.trim()) {
              imgInput.value = imgUrl;
              updateModalImagePreview(imgUrl);
              hint.textContent = '✓ Image récupérée automatiquement';
            } else {
              hint.textContent = 'Ajoutez une photo avec le bouton 📷 si besoin.';
            }
            if (title && !titleInput.value.trim()) {
              titleInput.value = title.split('|')[0].split(' - ')[0].trim().slice(0, 65);
            }
          } else {
            hint.textContent = 'Aperçu bloqué par le marchand (utilisez le bouton 📷).';
          }
        } catch (e) {
          hint.textContent = 'Utilisez le bouton 📷 pour choisir une image.';
        }
      }, 450);
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 500;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('gift-image-input').value = dataUrl;
          updateModalImagePreview(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveGiftFromModal() {
      const title = document.getElementById('gift-title-input').value.trim();
      const price = document.getElementById('gift-price-input').value.trim();
      const url = document.getElementById('gift-url-input').value.trim() || '#';
      const image = document.getElementById('gift-image-input').value.trim();

      if (!title) return;

      if (editingGiftId) {
        const idx = appState.gifts.findIndex(x => String(x.id) === String(editingGiftId));
        if (idx !== -1) {
          appState.gifts[idx] = {
            ...appState.gifts[idx],
            person: modalSelectedPerson,
            title,
            price,
            url,
            image
          };
        }
      } else {
        appState.gifts.push({
          id: 'gift-' + Date.now(),
          person: modalSelectedPerson,
          title,
          price,
          url,
          image
        });
      }

      currentPerson = modalSelectedPerson;
      saveStateLocally();
      renderAll();
      closeGiftModal();
      pushToGitHubIfConfigured();
    }

    function deleteGift(id) {
      appState.gifts = appState.gifts.filter(x => String(x.id) !== String(id));
      saveStateLocally();
      renderAll();
      pushToGitHubIfConfigured();
    }

    // =========================================================================
    // IMPORTATION DEPUIS VOTRE FICHIER index (1).html (RÉCUPÈRE LES 7 CADEAUX)
    // =========================================================================
    function importHTMLFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        const htmlText = e.target.result;
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        let importedGifts = [];

        // 1. Cherche d'abord un bloc JSON embarqué ou une variable INITIAL_GIFTS dans les scripts
        const jsonEl = doc.getElementById('embedded-app-state') || doc.getElementById('embedded-data');
        if (jsonEl && jsonEl.textContent.trim()) {
          try {
            const parsed = JSON.parse(jsonEl.textContent.trim());
            if (Array.isArray(parsed.gifts)) importedGifts = parsed.gifts;
            if (parsed.pin) appState.pin = String(parsed.pin);
          } catch (err) {}
        }

        if (importedGifts.length === 0) {
          const scripts = doc.querySelectorAll('script');
          scripts.forEach(s => {
            const txt = s.textContent || '';
            const match = txt.match(/INITIAL_GIFTS\s*=\s*(\[[\s\S]*?\]);/);
            if (match && match[1]) {
              try {
                const parsed = JSON.parse(match[1]);
                if (Array.isArray(parsed)) importedGifts = parsed;
              } catch (err) {}
            }
            const pinMatch = txt.match(/OWNER_PIN\s*=\s*["']([^"']+)["']/);
            if (pinMatch && pinMatch[1]) {
              appState.pin = pinMatch[1];
            }
          });
        }

        // 2. Sinon, extrait directement toutes les cartes présentes dans #gifts-grid (avec leurs images Base64)
        if (importedGifts.length === 0) {
          const cards = doc.querySelectorAll('#gifts-grid a.gift-card');
          cards.forEach((card, idx) => {
            const url = card.getAttribute('href') || '#';
            const imgEl = card.querySelector('img');
            const titleEl = card.querySelector('h2');
            const priceSpans = card.querySelectorAll('span');
            let price = '';
            priceSpans.forEach(sp => {
              const t = sp.textContent.trim();
              if (t && t !== '↗') price = t;
            });

            importedGifts.push({
              id: 'gift-imported-' + idx + '-' + Date.now(),
              person: currentPerson || 'Dorian',
              title: titleEl ? titleEl.textContent.trim() : 'Cadeau',
              price: price,
              url: url,
              image: imgEl ? imgEl.getAttribute('src') : ''
            });
          });
        }

        if (importedGifts.length > 0) {
          appState.gifts = importedGifts;
          saveStateLocally();
          renderAll();
          pushToGitHubIfConfigured();
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // =========================================================================
    // GÉNÉRATION D'UN FICHIER HTML 100 % PROPRE (SANS NOTIFICATION PERSISTANTE)
    // =========================================================================
    function buildCleanHTML() {
      saveStateLocally();
      const clone = document.documentElement.cloneNode(true);

      // Supprime les balises <style> dynamiques injectées par le CDN Tailwind pour garder un fichier léger
      clone.querySelectorAll('head style:not(#core-styles)').forEach(el => el.remove());

      // Vide les conteneurs dynamiques (ils sont reconstruits proprement au chargement)
      const grid = clone.querySelector('#gifts-grid');
      if (grid) grid.innerHTML = '';
      const tabs = clone.querySelector('#person-tabs');
      if (tabs) tabs.innerHTML = '';

      // Force le verrouillage du mode propriétaire et ferme toutes les fenêtres modales
      const ownerBar = clone.querySelector('#owner-bar');
      if (ownerBar) ownerBar.classList.add('hidden');
      const lockBtn = clone.querySelector('#lock-btn');
      if (lockBtn) lockBtn.textContent = '🔒';

      clone.querySelectorAll('.modal-backdrop, .modal-panel').forEach(el => {
        el.classList.remove('active');
      });

      return '<!DOCTYPE html>\n' + clone.outerHTML;
    }

    function downloadUpdatedHTML() {
      const cleanHtml = buildCleanHTML();
      const blob = new Blob([cleanHtml], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
    }

    // =========================================================================
    // SYNCHRONISATION DIRECTE GITHUB (SANS BANNIÈRE PERSISTANTE)
    // =========================================================================
    function getGitHubConfig() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_GH) || '{}');
      } catch (e) {
        return {};
      }
    }

    function updateGitHubIndicator() {
      const cfg = getGitHubConfig();
      const dot = document.getElementById('gh-status-dot');
      if (!dot) return;
      if (cfg.repo && cfg.token) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-zinc-400';
      }
    }

    function openGitHubModal() {
      const cfg = getGitHubConfig();
      document.getElementById('gh-repo-input').value = cfg.repo || '';
      document.getElementById('gh-branch-input').value = cfg.branch || 'main';
      document.getElementById('gh-path-input').value = cfg.path || 'index.html';
      document.getElementById('gh-token-input').value = cfg.token || '';
      document.getElementById('new-pin-input').value = '';
      openModal('gh-modal-backdrop', 'gh-modal-panel');
    }

    function closeGitHubModal() {
      closeModal('gh-modal-backdrop', 'gh-modal-panel');
    }

    function saveGitHubConfig() {
      const repo = document.getElementById('gh-repo-input').value.trim();
      const branch = document.getElementById('gh-branch-input').value.trim() || 'main';
      const path = document.getElementById('gh-path-input').value.trim() || 'index.html';
      const token = document.getElementById('gh-token-input').value.trim();

      localStorage.setItem(STORAGE_KEY_GH, JSON.stringify({ repo, branch, path, token }));
      updateGitHubIndicator();
      closeGitHubModal();
      pushToGitHubIfConfigured();
    }

    async function pushToGitHubIfConfigured() {
      const cfg = getGitHubConfig();
      if (!cfg.repo || !cfg.token) return;

      const dot = document.getElementById('gh-status-dot');
      if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-300 animate-pulse';

      try {
        const cleanHtml = buildCleanHTML();
        const path = cfg.path || 'index.html';
        const branch = cfg.branch || 'main';
        const apiUrl = `https://api.github.com/repos/${cfg.repo}/contents/${path}`;

        let sha = null;
        const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, {
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github+json'
          }
        });

        if (getRes.ok) {
          const existing = await getRes.json();
          sha = existing.sha;
        }

        const encodedContent = btoa(unescape(encodeURIComponent(cleanHtml)));
        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Mise à jour de la liste de cadeaux',
            content: encodedContent,
            branch: branch,
            ...(sha ? { sha } : {})
          })
        });

        if (dot) {
          dot.className = putRes.ok
            ? 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]'
            : 'w-2 h-2 rounded-full bg-rose-500';
        }
      } catch (e) {
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-rose-500';
      }
    }

    // =========================================================================
    // UTILITAIRES MODALES & TEXTE
    // =========================================================================
    function openModal(backdropId, panelId) {
      document.getElementById(backdropId).classList.add('active');
      document.getElementById(panelId).classList.add('active');
    }

    function closeModal(backdropId, panelId) {
      document.getElementById(backdropId).classList.remove('active');
      document.getElementById(panelId).classList.remove('active');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    initApp();
  </script>
